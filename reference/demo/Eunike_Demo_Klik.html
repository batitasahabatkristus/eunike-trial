<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Eunike</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Parisienne&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:#2A1740;background:#1d1030;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
img{display:block;max-width:100%}

/* ===== demo shell ===== */
.demo{display:grid;grid-template-columns:310px 1fr;grid-template-rows:54px 1fr;height:100vh}
.topbar{grid-column:1/3;background:#2A1740;color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #43285f}
.topbar .brand{font-family:'Baloo 2';font-weight:800;font-size:19px;letter-spacing:.2px}
.topbar .tag{font-size:12px;background:#DD1F4A;border-radius:999px;padding:3px 10px;font-weight:700}
.topbar .sp{flex:1}
.topbar select,.topbar .tb{background:#3a2356;color:#fff;border:1px solid #5a3b80;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700}
.topbar .tb.on{background:#8446C9;border-color:#a76bdf}
.burger{display:none}
.side{overflow:auto;background:#1d1030;color:#e9defa;padding:14px 14px 40px;font-size:13px}
.side h4{font-family:'Baloo 2';font-size:15px;color:#fff;margin:14px 0 6px}
.side .hint{color:#b9a3d6;line-height:1.45}
.side .step{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:8px 9px;border-radius:10px;color:#e9defa;line-height:1.3}
.side .step:hover{background:#2c1946}
.side .step.on{background:#43285f;color:#fff}
.side .step .n{flex:none;width:22px;height:22px;border-radius:50%;background:#5a3b80;color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.side .step.on .n{background:#DD1F4A}
.side .group{margin-top:10px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#a58cc9}
.side .jump{display:block;width:100%;text-align:left;padding:5px 9px;border-radius:8px;color:#cdb9ea}
.side .jump:hover{background:#2c1946;color:#fff}
.stage{overflow:auto;background:radial-gradient(1200px 700px at 30% 0%,#3a2356,#1d1030 70%);display:flex;justify-content:center;align-items:flex-start;padding:18px}
.fitbox{position:relative;flex:none}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:38px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 9px #0f0818,0 0 0 11px #3b2655;background:#fff}
.frame.desk{border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 3px #3b2655}
.frame.phone{width:390px;height:812px}
.frame.phone.land{width:812px;height:390px;border-radius:30px}
.frame.tablet{width:1024px;height:768px;border-radius:26px}
.frame.desk{width:1280px;height:780px}
.screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(circle at 0% 0%,var(--blob1) 0 80px,transparent 81px),radial-gradient(circle at 100% 4%,var(--blob2) 0 110px,transparent 111px),radial-gradient(circle at 0% 100%,var(--blob3) 0 130px,transparent 131px),radial-gradient(circle at 100% 96%,var(--blob2) 0 90px,transparent 91px)}
.screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;pointer-events:none;z-index:0;opacity:.55;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='70' viewBox='0 0 400 70'><g fill='none' stroke='%238446C9' stroke-width='1' opacity='.55'><path d='M0 40 Q50 15 100 40 T200 40 T300 40 T400 40'/><path d='M0 48 Q50 23 100 48 T200 48 T300 48 T400 48'/><path d='M0 56 Q50 31 100 56 T200 56 T300 56 T400 56'/></g></svg>") repeat-x bottom/400px 70px}
.screen>*{position:relative;z-index:1}

/* themes */
[data-theme=sk]{--bg:#FFF2F6;--blob1:rgba(255,170,200,.45);--blob2:rgba(190,150,235,.35);--blob3:rgba(255,170,200,.4);--purple:#5B2590;--purple2:#8446C9;--red:#DD1F4A;--redd:#B8123A;--lilac:#F1E7FC;--blush:#FDE5EE;--peach:#FFF0D4;--mint:#E2F5E9;--text:#2A1740;--muted:#6B5A7E;--line:#F1DEEA;--off:#E8D5F0;--ok:#1B8A4B;--card:#fff;--accent:#DD1F4A}
[data-theme=eu]{--bg:#FEECE2;--blob1:rgba(221,24,138,.22);--blob2:rgba(190,150,235,.4);--blob3:rgba(252,211,201,.7);--purple:#612E8F;--purple2:#8446C9;--red:#DD1F4A;--redd:#B8123A;--lilac:#EDE2F8;--blush:#FAD9E8;--peach:#FCD3C9;--mint:#E2F5E9;--text:#2A1163;--muted:#6B5A7E;--line:#EBDCF0;--off:#D9C7E1;--ok:#1B8A4B;--card:#fff;--accent:#DD188A}

/* ===== type ===== */
.h1{font-family:'Baloo 2';font-weight:800;font-size:28px;line-height:1.05;color:var(--purple)}
.h2{font-family:'Baloo 2';font-weight:700;font-size:20px;line-height:1.1;color:var(--purple)}
.h3{font-family:'Baloo 2';font-weight:700;font-size:16px;color:var(--purple)}
.fred{font-family:'Fredoka';font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.accent-font{font-family:'Parisienne';color:var(--accent);font-size:22px}
.red{color:var(--red)}.purple{color:var(--purple)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.g6{gap:6px}.g14{gap:14px}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
.center{text-align:center}

/* ===== phone layout ===== */
.scroll{flex:1;overflow:auto;padding:14px 14px 22px;scrollbar-width:thin}
.scroll.nb{padding-bottom:104px}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.hdr .t{font-family:'Baloo 2';font-weight:800;font-size:22px;line-height:1.05;color:var(--purple);flex:1}
.hdr .t small{display:block;font-family:'Nunito';font-weight:600;font-size:12px;color:var(--muted)}
.back{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--purple);font-size:20px;box-shadow:0 4px 12px rgba(91,37,144,.12)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--lilac);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--purple);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.bnav{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:26px 26px 22px 22px;box-shadow:0 -6px 26px rgba(91,37,144,.16);display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));z-index:5;border:1px solid var(--line)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:18px;font-size:12px;font-weight:700;color:var(--muted)}
.bnav button .ic{font-size:21px;line-height:1}
.bnav button.on{background:#FDE5EE;color:var(--red)}
[data-theme=eu] .bnav button.on{background:var(--lilac);color:var(--purple)}

/* ===== components ===== */
.card{background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(91,37,144,.08);padding:14px}
.card.lilac{background:var(--lilac)}.card.blush{background:var(--blush)}.card.mint{background:var(--mint)}.card.peach{background:var(--peach)}
.card.click{cursor:pointer;text-align:left;width:100%}
.card.click:hover{border-color:var(--purple2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-family:'Fredoka';font-weight:600;font-size:16px;white-space:nowrap}
.btn.red{background:var(--red);color:#fff;box-shadow:0 8px 18px rgba(221,31,74,.28)}
.btn.purple{background:var(--purple);color:#fff;box-shadow:0 8px 18px rgba(91,37,144,.28)}
.btn.ghost{background:#fff;color:var(--purple);border:1.5px solid var(--off)}
.btn.text{color:var(--purple);min-height:36px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.btn.green{background:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.block{display:flex;width:100%}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--off);font-weight:700;font-size:14px;color:var(--purple)}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.chip.sm{padding:5px 11px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.nowrap{flex-wrap:nowrap;overflow:auto;padding-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap}
.b-pending{background:#FFE9C7;color:#8a4b00}.b-need{background:#FFD9E8;color:#B0105F}.b-interview{background:#E5D6FA;color:#4b1f86}
.b-selesai{background:#DDF3E5;color:#14703b}.b-active{background:#D7EBFF;color:#0b4f96}.b-rejected{background:#FFD8D8;color:#9b1c1c}
.b-batal{background:#E4E1EA;color:#5a5068}.b-draft{background:#E8E1F2;color:#5b4a73}.b-terbit{background:#DDF3E5;color:#14703b}
.b-terjadwal{background:#FFE9C7;color:#8a4b00}.b-baru{background:var(--red);color:#fff}.b-ok{background:#DDF3E5;color:#14703b}
.b-warn{background:#FFE9C7;color:#8a4b00}.b-lock{background:#E4E1EA;color:#4a3f5c}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:800;font-size:14px;color:var(--purple)}
.inp,.sel,.ta{width:100%;border:1.5px solid var(--off);background:#fff;border-radius:14px;padding:12px 14px;outline:none;min-height:48px}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(132,70,201,.18)}
.ta{min-height:96px;resize:vertical;line-height:1.45}
.inp.err{border-color:var(--red);background:#FFF5F7}
.errmsg{color:var(--red);font-weight:800;font-size:13px}
.hintmsg{color:var(--muted);font-size:13px}
.pfx{display:flex;gap:8px}.pfx .p{flex:none;min-width:54px;display:flex;align-items:center;justify-content:center;background:var(--lilac);border:1.5px solid var(--off);border-radius:14px;font-weight:800;color:var(--purple)}
.tog{position:relative;width:52px;height:30px;border-radius:999px;background:var(--off);flex:none;transition:.15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tog.on{background:var(--purple)}.tog.on::after{left:25px}
.seg{display:flex;background:var(--lilac);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-weight:800;font-size:14px;color:var(--purple)}
.seg button.on{background:var(--purple);color:#fff}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--purple2);color:#fff;font-family:'Baloo 2';font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.sm{width:34px;height:34px;font-size:15px}
.avatar.lilac{background:var(--lilac);color:var(--purple)}
.prog{height:9px;border-radius:99px;background:var(--off);overflow:hidden}.prog>i{display:block;height:100%;background:var(--red);border-radius:99px}
.strip{display:flex;gap:3px}.strip i{flex:1;height:9px;border-radius:5px;background:var(--off)}.strip i.d{background:var(--red)}.strip i.c{background:var(--purple)}
.sep{height:1px;background:var(--line);margin:10px 0}
.kv{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-weight:800;color:var(--purple);min-width:86px}
.ic-c{width:38px;height:38px;border-radius:50%;background:var(--lilac);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;font-size:14px;font-weight:700}
.banner.info{background:var(--lilac);color:var(--purple)}.banner.warn{background:#FFE9C7;color:#8a4b00}.banner.err{background:#FFD8D8;color:#9b1c1c}.banner.ok{background:var(--mint);color:#14703b}
.logo{height:64px;mix-blend-mode:multiply}
.logo.sm{height:42px}
.stat{font-family:'Baloo 2';font-weight:800;font-size:34px;line-height:1;color:var(--purple)}
.sheet-back{position:absolute;inset:0;background:rgba(30,12,48,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:16px 16px 24px;max-height:86%;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--off);margin:0 auto 12px}
.modal-back{position:absolute;inset:0;background:rgba(30,12,48,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:520px;max-height:92%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.drawer-back{position:absolute;inset:0;background:rgba(30,12,48,.4);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:#fff;width:400px;max-width:90%;height:100%;padding:18px;overflow:auto}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#2A1740;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;box-shadow:0 10px 26px rgba(0,0,0,.35);max-width:86%;text-align:center}
.frame.desk .toast{bottom:28px}

/* ===== SK lesson ===== */
.famhdr{display:flex;align-items:center;gap:12px;background:var(--lilac);border-radius:20px;padding:12px;border:1px solid var(--line)}
.famhdr .nm{font-family:'Baloo 2';font-weight:800;font-size:24px;line-height:1;color:var(--purple)}
.datakel{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 12px;font-weight:800;font-size:15px;width:100%;text-align:left}
.datakel.ok{background:var(--mint);color:var(--ok)}.datakel.cor{background:var(--lilac);color:var(--purple)}.datakel.cek{background:#FFF0D4;color:#a8570c}
.lstrip{display:flex;gap:9px;overflow:auto;padding:2px 2px 6px;scrollbar-width:none}
.lit{flex:none;width:120px;background:#fff;border-radius:16px;padding:5px;border:2px solid transparent;text-align:left;box-shadow:0 5px 14px rgba(91,37,144,.1)}
.lit img{width:100%;height:68px;object-fit:cover;border-radius:12px}
.lit .n{font-family:'Baloo 2';font-weight:800;font-size:13px;color:var(--purple);margin-top:4px;line-height:1}
.lit .s{font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.15}
.lit.on{border-color:var(--purple2);background:#fff}
.lit .stamp{position:absolute}
.hero{background:#fff;border-radius:22px;padding:14px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(91,37,144,.12)}
.hero .top{display:flex;gap:12px}
.hero .ttl{font-family:'Baloo 2';font-weight:800;font-size:26px;line-height:1;color:var(--purple)}
.hero img{width:128px;height:108px;object-fit:cover;border-radius:16px;flex:none}
.pills{display:flex;gap:8px}
.pill{flex:1;padding:10px 6px;border-radius:999px;background:#fff;border:1.5px solid var(--off);font-weight:800;color:var(--purple);text-align:center}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.story-img{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:4/3}
.story-img img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.story-img .exp{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--purple);font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:800}
.narr{background:#fff;border-radius:18px;border:1px solid var(--line);padding:14px 16px;font-size:17px;line-height:1.55;overflow:auto;max-height:190px}
.narr b{font-family:'Baloo 2';font-size:20px;color:var(--purple);display:block;margin-bottom:4px}
.storywrap{display:flex;flex-direction:column;gap:10px}
.frame.tablet .storywrap{display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr;gap:14px;align-items:start}
.frame.tablet .storywrap .story-img{grid-row:1/3}
.frame.tablet .narr{max-height:300px;font-size:19px}
.frame.tablet .scroll{padding-left:30px;padding-right:30px}
.frame.tablet .bnav{left:calc(50% - 260px);right:calc(50% - 260px)}
.frame.tablet .hold{max-width:980px;margin:0 auto}
.fs{position:absolute;inset:0;background:#150D1D;z-index:30;display:flex;flex-direction:column;color:#fff}
.fs .fsimg{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fs .fsimg img{width:100%;height:100%;object-fit:contain}
.fs .min{position:absolute;right:14px;top:14px;background:#fff;color:var(--purple);border-radius:999px;padding:10px 16px;font-family:'Fredoka';font-weight:600;display:flex;align-items:center;gap:8px;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.fs .panel{background:#fff;color:#2A1740;border-radius:20px 20px 0 0;padding:12px 16px;max-height:44%;overflow:auto;font-size:16px;line-height:1.5}
.frame.land .fs{flex-direction:row}
.frame.land .fs .panel{width:34%;max-height:none;border-radius:20px 0 0 20px;order:2}
.fs .rot{position:absolute;inset:0;background:rgba(21,13,29,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;z-index:2}
.fs .rot .ph{font-size:64px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

/* ===== desktop ===== */
.dwrap{display:grid;grid-template-columns:232px 1fr;height:100%}
.dside{background:rgba(255,255,255,.85);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.dside .logoph{height:54px;border:1.5px solid var(--off);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--off);margin-bottom:10px}
.dside .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:800;color:var(--purple);text-align:left;width:100%}
.dside .nav:hover{background:var(--lilac)}
.dside .nav.on{background:var(--purple);color:#fff}
.dside .me{margin-top:auto;padding:10px;border-radius:14px;background:var(--lilac);display:flex;align-items:center;gap:10px;font-weight:800;color:var(--purple)}
.dmain{overflow:auto;padding:20px 24px 30px;position:relative}
.dtitle{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dtitle .h1{font-size:32px}
.modchip{border:1.5px solid var(--purple);color:var(--purple);border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px;background:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g21{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.kpi{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(91,37,144,.08)}
.kpi .lb{font-weight:800;color:var(--muted);font-size:13px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.tbl th{background:var(--lilac);color:var(--purple);text-align:left;font-weight:800;font-size:13px;padding:11px 12px}
.tbl td{padding:11px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr.rw{cursor:pointer}.tbl tr.rw:hover td{background:#FBF6FF}
.tbl tr.sel td{background:var(--lilac)}
.bars{display:flex;align-items:flex-end;gap:18px;height:170px;padding:10px 6px 0;border-bottom:2px solid var(--line)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.bars .b i{display:block;width:100%;max-width:70px;background:linear-gradient(180deg,var(--purple2),var(--purple));border-radius:10px 10px 0 0}
.bars .b span{font-weight:800;font-size:13px;color:var(--purple)}
.barlbl{display:flex;gap:18px;padding:6px 6px 0}.barlbl span{flex:1;text-align:center;font-weight:800;color:var(--muted);font-size:13px}
.tl{display:flex;flex-direction:column;gap:0}
.tl .s{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl .s:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--off)}
.tl .dot{width:30px;height:30px;border-radius:50%;background:var(--off);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex:none}
.tl .s.done .dot{background:var(--purple)}.tl .s.cur .dot{background:#fff;border:3px solid var(--purple);color:var(--purple)}
.tl .s b{display:block;color:var(--purple);font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{font-weight:800;color:var(--purple);text-align:center;padding:6px 0;font-size:13px}
.cal .d{min-height:78px;background:#fff;border-radius:12px;border:1px solid var(--line);padding:6px;font-size:13px;font-weight:700;color:var(--muted);text-align:left;position:relative}
.cal .d.off{opacity:.45}
.cal .d.sel{border:2px solid var(--purple2)}
.cal .d .ev{display:block;margin-top:4px;border-radius:8px;padding:3px 6px;font-size:11.5px;font-weight:800;line-height:1.15}
.ev.terbit{background:#DDF3E5;color:#14703b}.ev.terjadwal{background:#FFE9C7;color:#8a4b00}.ev.draft{background:#E8E1F2;color:#5b4a73}
.qr{background:#fff;padding:12px;border-radius:18px;display:inline-block;box-shadow:inset 0 0 0 1px var(--line)}
.dayrow{display:flex;gap:6px}.dayrow button{flex:1;border-radius:14px;background:#fff;padding:8px 0;text-align:center;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.dayrow button b{display:block;font-size:17px;color:var(--purple)}.dayrow button.on{background:var(--purple);color:#fff}.dayrow button.on b{color:#fff}
.evrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;border:1px solid var(--line);width:100%;text-align:left}
.evrow .tag{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:18px;flex:none}
.tag.sk{background:#FDE5EE;color:#DD188A}.tag.ktb{background:var(--lilac);color:var(--purple)}.tag.ev{background:#FFE9C7;color:#a8570c}
.tile{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:13px;border:1px solid var(--line);font-weight:800;color:var(--purple);text-align:left;width:100%;position:relative;font-size:15px;line-height:1.1}
.tile .ic{width:44px;height:44px;border-radius:50%;background:var(--lilac);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.tile.hi{border:2px solid var(--purple);background:var(--lilac)}
.tile .bd{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.post{background:#fff;border-radius:18px;padding:12px;border:1px solid var(--line);display:flex;gap:10px}
.menu{position:absolute;right:8px;top:36px;background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.2);border:1px solid var(--line);z-index:6;overflow:hidden}
.menu button{display:flex;gap:8px;padding:10px 16px;font-weight:700;color:var(--purple);width:100%;text-align:left}
.menu button:hover{background:var(--lilac)}
.photo{background:var(--lilac);border:2px dashed var(--off);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--purple2);font-weight:800;letter-spacing:.5px}
.drop{border:2px dashed var(--purple2);border-radius:18px;padding:12px;background:#fff}
.drop.err{border-color:var(--red)}
.thumbs{display:flex;gap:8px}.thumbs img{width:78px;height:62px;object-fit:cover;border-radius:12px}
.hr-gap{height:6px}
.scrollx{overflow:auto}
.mini{font-size:11px;color:var(--muted)}
.tabs2{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;overflow:auto}
.tabs2 button{padding:9px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs2 button.on{color:var(--purple);border-color:var(--purple)}
.lock{display:flex;gap:8px;align-items:center;background:#F3F0F7;border-radius:12px;padding:9px 12px;font-weight:700;color:#4a3f5c;font-size:13px}
.checkrow{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:13px 14px;border:1px solid var(--line);width:100%;text-align:left;font-weight:800;color:var(--purple);font-size:16px}
.cb{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--purple2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:none}
.cb.on{background:var(--red);border-color:var(--red)}
.cb.sq{border-radius:8px}
.ghostbox{border:2px dashed var(--off);border-radius:18px;padding:18px;text-align:center;color:var(--muted)}
@media (max-width:860px){
 .demo{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:54px;bottom:0;width:300px;z-index:50;transform:translateX(-102%);transition:.2s;box-shadow:10px 0 30px rgba(0,0,0,.4)}
 .side.open{transform:none}
 .burger{display:inline-flex}
 .topbar .tag,.topbar .brand small{display:none}
 .stage{padding:8px}
}
.side2{display:flex;flex-direction:column;gap:10px;min-width:0}
.frame.tablet .storywrap{grid-template-rows:auto}
.frame.tablet .fs{flex-direction:row}
.frame.tablet .fs .panel{width:36%;max-height:none;border-radius:20px 0 0 20px;order:2}
.hold{width:100%}
.frame.land .storywrap{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:start}
.frame.land .narr{max-height:120px;font-size:15px}
.frame.land .bnav{left:calc(50% - 230px);right:calc(50% - 230px)}
.frame.land .scroll{padding-bottom:96px}
.frame.land .hdr{padding-top:8px}
.frame.land .fs .min,.frame.tablet .fs .min{right:auto;left:14px}
.topbar{padding-top:env(safe-area-inset-top,0px);height:calc(54px + env(safe-area-inset-top,0px))}
</style></head><body>

/* ================= Eunike clickable demo: core ================= */
const App = { screens: {}, roles: [], ACT: {}, OV: {} };
const J = o => JSON.stringify(o).replace(/'/g, '&#39;');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function def(id, o) { App.screens[id] = Object.assign({ id, theme: 'eu', dev: 'phone', title: id }, o); }
function defOv(id, fn) { App.OV[id] = fn; }
function defAct(name, fn) { App.ACT[name] = fn; }

/* ---------- html helpers ---------- */
function attrs(o) {
  let s = '';
  if (o.go) s += ` data-go="${o.go}"`;
  if (o.p) s += ` data-p='${J(o.p)}'`;
  if (o.act) s += ` data-act="${o.act}"`;
  if (o.a) s += ` data-a='${J(o.a)}'`;
  return s;
}
const B = (label, o = {}) => `<button class="btn ${o.k || 'red'} ${o.cls || ''}"${attrs(o)}>${label}</button>`;
const CHIP = (label, on, o = {}) => `<button class="chip ${on ? 'on' : ''} ${o.cls || ''}"${attrs(o)}>${label}</button>`;
const BADGE = (txt, kind) => `<span class="badge b-${kind}">${txt}</span>`;
const AV = (t, cls = '') => `<div class="avatar ${cls}">${esc(t)}</div>`;
const TOG = (on, o) => `<button class="tog ${on ? 'on' : ''}"${attrs(o)} aria-label="ubah"></button>`;
const INP = (label, path, o = {}) => {
  const v = o.v !== undefined ? o.v : getPath(App.S, path);
  const lbl = label ? `<label>${label}</label>` : '';
  let ctl;
  if (o.type === 'ta') ctl = `<textarea class="ta ${o.err ? 'err' : ''}" data-bind="${path}" placeholder="${esc(o.ph || '')}">${esc(v || '')}</textarea>`;
  else if (o.type === 'sel') ctl = `<select class="sel" data-bind="${path}">${o.opts.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;

const STORY_AGES = ['1-2', '2-3', '3-4'];
def('sk_alur', { theme: 'sk', title: 'Alur belajar', group: 'Orang tua', render() {
  const S = App.S, l = lessonOf(S.lesson), cur = S.step[l.n], st = STEPS[cur], complete = S.done[l.n] >= 24;
  const strip = STEPS.map((x, i) => `<i class="${complete || i < cur ? 'd' : (i === cur ? 'c' : '')}"></i>`).join('');
  const storyN = st.story !== undefined ? st.story : null;
  let card;
  if (storyN !== null) {
    const sc = SCENES[storyN];
    card = `<div class="card"><div class="h2">Cerita Alkitab</div><div class="story-img mt8" data-go="sk_cerita" style="cursor:pointer">${sceneImg(sc)}<div class="exp">⤢</div></div><div class="mt8" style="font-size:17px;line-height:1.5">${esc(sc.n['2-3'])}</div><div class="mt8">${B('Buka cerita besar', { go: 'sk_cerita', k: 'ghost', cls: 'sm' })}</div></div>`;
  } else {
    card = `<div class="card"><div class="h2">${st.t}</div><div class="story-img mt8" style="aspect-ratio:16/8"><img src="${IMG[l.img]}" alt="" style="object-position:center"></div><div class="mt8" style="font-size:17px;line-height:1.5">${esc(st.tx)}</div>${st.tab ? `<div class="mt8">${B('Buka bagian ini', { go: st.tab, k: 'ghost', cls: 'sm' })}</div>` : ''}</div>`;
  }
  return `<div class="hdr"><button class="back" data-go="sk_home">‹</button><div class="t" style="font-size:20px">Pelajaran ${l.n} · ${l.title}</div></div><div class="scroll nb"><div class="col g14">
   <div class="strip">${strip}</div>
   <div class="row between small" style="font-weight:800;color:var(--purple)"><span>Langkah ${cur + 1} dari 24</span><span class="muted">${storyN !== null ? `Cerita Alkitab · ${storyN + 1} dari 5` : st.t}</span></div>
   ${card}
   <div class="row"><button class="btn ghost grow ${cur === 0 ? 'dis' : ''}" data-act="stepmove" data-a='{"d":-1}'>‹ Sebelumnya</button><button class="btn red grow" data-act="stepmove" data-a='{"d":1}'>${cur === 23 ? 'Selesai' : 'Lanjut'} ›</button></div>
  </div></div>${NAVSK('sk_alur')}`;
} });
defAct('stepmove', a => {
  const S = App.S, n = S.lesson; let c = S.step[n] + a.d;
  if (c < 0) return; if (c > 23) { S.done[n] = 24; go('sk_selesai'); return; }
  S.step[n] = c; if (c + 1 > S.done[n] && S.done[n] < 24) S.done[n] = c; render();
  const inCerita = App.S.cur.id === 'sk_cerita';
  if (inCerita && STEPS[c].story === undefined) go('sk_alur');
});
